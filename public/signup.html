<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    

     <a href="index.html"><img src="images/loogo.png"></a>

   <div class="login-container">
    <form action="/signup" method="POST">

    <div class="heading">
<h1>Sign Up</h1>
</div>

    <div class="input">
<input type="text" name="Title" placeholder="Title" required><br><br>
<input type="text"  name="Gender" placeholder="Gender" required><br><br>
<input type="text" name="Name" placeholder="Name" ><br><br>
<input type="text" name="Surname" placeholder="Surname"><br><br>
<input type="email" name="Email" placeholder="example@gmail.com"><br><br>
 <input type="text" name="CompanyName"placeholder="The name of the company you work at:"><br><br>
 <input type="password" name="Password" placeholder="password" minlength="8"><br><br>
 <!-- <input type="password" name="ConfirmPassword"placeholder="Confirm Password" minlength="8"><br><br>--->
 <label for="device type">Where did you hear about us?</label>


    <select id="device type" name="HearAboutUs">
    <option value="None">--Choose an Option--</option >
    <option value="Social Media">Social Media</option >
    <option value="friend">A friend</option >   
    <option value="Workplace">Workplace</option > 
    <option value="Law Organization">Law Organization</option > 
    <option value="Campaign">Campaign</option > 
        
    </select><br><br><br>

</div>

<div class="signBtn">

<button>Create Account</button>
</div>

<div class="forgotLink">
<p>Already have an account?</p>

<div class="signBtn">
<a href="login.html"><button>Login</button></a>
</div>
</div>

</form>

   </div>

</body>
